[files]
extend-exclude = ["*.svg"]

[default]
# YouTube and Vimeo video IDs in grid `href` props are random strings.
extend-ignore-re = ["\\w{51,}", "href: ['\"][\\w-]+['\"]"]

[default.extend-words]
alumi = "alumni"
conttonwood = "cottonwood"

# Surnames and given names of alumni, not typos.
[default.extend-identifiers]
Dimond = "Dimond"
KaeLene = "KaeLene"
Ned = "Ned"
Sprinkel = "Sprinkel"
Toom = "Toom"
