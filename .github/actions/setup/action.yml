# This action restores the pnpm store cache. Any job on main can write that
# cache, so do not use this action in a job that holds write tokens, such as
# the release job.
name: Setup
description: Install pnpm, Node LTS, and the site's dependencies. Check out the repository first.

runs:
  using: composite
  steps:
    - name: Setup PNPM
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: latest

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 'lts/*'
        cache: 'pnpm'

    - name: Install Dependencies
      shell: bash
      run: pnpm i
