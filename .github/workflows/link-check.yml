name: Link Checker

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check_links:
    name: Link Checking
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Recent successful runs took 30 s to 3.5 min, mostly waiting on
    # external links. 15 leaves room for slow hosts without letting a hung
    # job run for six hours.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build Docs
        run: pnpm run build

      - name: Restore lychee cache
        id: restore-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Link Checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          # Check links to our own domain against the build, not the live
          # site, which sits behind Cloudflare bot rules. See `just link-check`.
          # lychee reads every other setting from lychee.toml.
          args: >-
            --no-progress
            --remap '^https://alumni\.cottonwoodhigh\.school/(.*)$ file://${{ github.workspace }}/dist/$1'
            'dist/**/*.html'
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Save lychee cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: .lycheecache
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}
