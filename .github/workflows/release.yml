name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never interrupt an in-flight publish; a cancelled release can leave tags and
  # the registry in an inconsistent state.
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release commit and version tags
      pull-requests: write # open and update the release pull request
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      published-packages: ${{ steps.changesets.outputs.published-packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # changesets/action@v2 pushes the release commit and tags through the
          # GitHub API (authenticated by its github-token input), so no git
          # credentials need to persist in the checkout.
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: latest
          cache: true
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: just,jaq,sd,git-stats
      - run: just install
      - name: Create Release Pull Request or Tag
        id: changesets
        uses: changesets/action@22ccf9aa43179fe9e27dc62e575971d28cce197c # v2.0.0
        with:
          version-script: just version
          publish-script: pnpm changeset publish
          commit-message: "chore(release): bump version"
          pr-title: "chore(release): bump version"
        env:
          # @changesets/changelog-github reads this to fetch PR metadata while
          # `changeset version` generates changelog entries.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
