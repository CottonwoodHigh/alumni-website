# Vale configuration: https://vale.sh/docs/topics/config
StylesPath = .vale/styles
MinAlertLevel = suggestion

Packages = write-good, proselint, alex

[*.{md,mdx}]
BasedOnStyles = write-good, proselint, alex

# Blockquotes on this site hold verbatim posts and messages from alumni. Their
# words are quoted, so we cannot correct them without misquoting the author.
BlockIgnores = (?m)^ *>.*$

# E-Prime objects to every form of "to be". write-good itself ships this rule
# disabled, and enabling it buries the useful alerts.
write-good.E-Prime = NO

# This rule rewrites "alumni" to "graduates". That word is the subject of the
# whole site, so the suggestion is never actionable.
proselint.GenderBias = NO

# alex checks profanity against a wordlist that collides with real alumni
# names (Randy, Jerry, Sissy, Dix) and with "funeral" on in-memoriam pages.
alex.ProfanityLikely = NO
alex.ProfanityMaybe = NO
alex.ProfanityUnlikely = NO

# Matches are "Special Note" on reunion listings, never a person, which is the
# only context where "special" reads as ablist.
alex.Ablist = NO
